<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icespire mark: a jagged snow-capped range on an inked plate, with a
       copper moon behind the tallest peak. Coldforge palette; the inks are
       literal because a favicon cannot inherit currentColor. The multi-peak
       silhouette reads clearly at 16px. -->
  <rect width="64" height="64" rx="9" fill="#0b1317"/>
  <circle cx="43" cy="21" r="8" fill="#c9702f"/>
  <!-- Range: left foot up over a lower peak, down to a notch, up over the
       tall peak, down to the right foot. -->
  <path d="M4 54 L23 22 L34 40 L45 14 L60 54 Z" fill="#2f7f99"/>
  <!-- Snow caps sitting on each peak. -->
  <path d="M17.6 33.4 L23 22 L28.6 33 L25.4 30.8 L21.4 33.8 L19.4 31.8 Z" fill="#ffffff"/>
  <path d="M39.4 23.4 L45 14 L50.8 23.8 L47.4 21.4 L43.4 24.8 L41.4 22.4 Z" fill="#ffffff"/>
</svg>
