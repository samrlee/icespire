name: CI

# Run on every pull request, and on pushes to main.
# This is the "robot reviewer" that verifies the site builds
# before anything can be merged and deployed.
on:
  pull_request:
  push:
    branches: [main]

# This job only reads the repo and builds it — it never writes back.
permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Nothing here pushes, so don't leave the job's token sitting in
          # .git/config while the build runs a pull request's dependencies.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dependabot opens its PRs weekly; this says the same thing on the day
      # an advisory lands, and only for what the site actually ships.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
